services:
  db:
    image: postgres:16-alpine
    container_name: stock_alamos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: stock_pass
      POSTGRES_DB: stock_alamos
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_alamos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: stock_alamos_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stock_user:stock_pass@db:5432/stock_alamos
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ../backend:/app

  mailpit:
    image: axllent/mailpit:latest
    container_name: stock_alamos_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"


  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: stock_alamos_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
